{% extends 'base.html' %}

{% block title %}Додати новий продукт{% endblock %}

{% block content %}
<h2>Додати новий продукт</h2>

<form method="post" action="{% url 'add_product' %}">
    {% csrf_token %}
    <div>
        <label>Назва продукту:</label><br>
        <input type="text" name="name" required>
    </div><br>
    <div>
        <label>Категорія:</label><br>
        <input type="text" name="category" required>
    </div><br>
    <div>
        <label>Вага (г):</label><br>
        <input type="number" min="1" name="weight_grams" value="100" required>
    </div><br>
    <div>
        <label>Термін придатності:</label><br>
        <input type="date" name="expiry_date" required>
    </div><br>
    <div>
        <label>Ціна (грн):</label><br>
        <input type="number" step="0.01" min="0" name="price" required>
    </div><br>
    <button type="submit">Зберегти продукт</button>
</form>
{% endblock %}
